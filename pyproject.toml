[project]
name = "mediacenter"
version = "1.2.28"
description = "Independent server multimedia model kernel"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["redis==5.3.1", "Pillow==11.3.0"]

[project.scripts]
mediacenter = "mediacenter.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.unittest]
start-directory = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
