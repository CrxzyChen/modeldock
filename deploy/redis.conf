# Redis 7.2.16. Provision directories and generated ACL secrets explicitly.
# No public TCP listener; runtime may mount only this private socket.
port 0
bind 127.0.0.1
protected-mode yes
unixsocket /run/mediacenter/redis.sock
unixsocketperm 700
daemonize no
dir /var/lib/mediacenter-redis
# Dynamic epoch users must survive Redis/container restarts.  Keep the ACL
# file in the private writable data volume; only the bootstrap credentials
# themselves remain immutable secret files.
aclfile /var/lib/mediacenter-redis/mediacenter-redis.acl
appendonly yes
appendfsync everysec
save ""
maxmemory 2gb
maxmemory-policy noeviction
# Enforce the largest possible untrusted RPUSH element/query before Lua reads.
# Redis 7.2's minimum bulk limit is 1 MiB; protocol Envelope remains 256 KiB.
proto-max-bulk-len 1mb
client-query-buffer-limit 2mb
# Slow telemetry subscribers are disconnected, not accumulated or persisted.
client-output-buffer-limit pubsub 1mb 256kb 1
# Never trim reliable streams just to reclaim memory. Pause new dispatch.
