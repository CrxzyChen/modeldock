# MediaCenter control-plane proxy example. Keep this location unbuffered so
# client events are delivered immediately instead of accumulating on disk.
upstream mediacenter_control {
    server 127.0.0.1:8787;
    keepalive 8;
}

location = /api/v1/events {
    proxy_pass http://mediacenter_control;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 30s;
}

